<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Доска</title>
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module" src="/app.js"></script>
<main>
  <header class="app-header">
    <h1 id="title">Доска</h1>
    <button id="settings" class="club-settings" aria-label="Настройки" hidden>⚙</button>
  </header>
  <p id="status" role="status"></p>
  <section id="lobby" hidden>
    <div class="club-hero" aria-hidden="true"><canvas data-club-art="hero" width="499" height="232"></canvas></div>
    <button id="resume" hidden>Продолжить партию</button>
    <button class="club-tile draughts-tile" data-game="draughts"><canvas data-club-art="draughts" width="250" height="120" aria-hidden="true"></canvas><span>Русские шашки</span></button>
    <button class="club-tile chess-tile" data-game="chess"><canvas data-club-art="chess" width="250" height="120" aria-hidden="true"></canvas><span>Шахматы</span></button>
  </section>
  <section id="extras" hidden>
    <div id="party-panel" hidden>
      <div class="actions archive-tabs">
        <button id="active-rooms" type="button">Активные</button>
        <button id="archived-rooms" type="button">Завершённые</button>
      </div>
      <div id="room-list"></div>
    </div>
    <div id="puzzle-panel" hidden class="actions">
      <button class="club-tile" data-puzzle="draughts"><canvas data-club-art="draughts" width="250" height="120" aria-hidden="true"></canvas><span>Русские шашки<small>Задача дня</small></span></button>
      <button class="club-tile" data-puzzle="chess"><canvas data-club-art="chess" width="250" height="120" aria-hidden="true"></canvas><span>Шахматы<small>Задача дня</small></span></button>
    </div>
    <div id="series-panel" class="actions" hidden>
      <button data-series="mate">Мат в один</button>
      <button data-series="chain">Серия взятий</button>
      <button data-series="crown">Превращение в дамку</button>
    </div>
    <nav class="club-nav" aria-label="Главное меню">
      <button id="play-tab" aria-pressed="true"><canvas data-club-art="chess" width="250" height="120" aria-hidden="true"></canvas><span>Играть</span></button>
      <button id="my-games" aria-pressed="false"><canvas data-club-art="draughts" width="250" height="120" aria-hidden="true"></canvas><span>Партии</span></button>
      <button id="puzzle-tab" aria-pressed="false"><canvas data-club-art="puzzle" width="250" height="120" aria-hidden="true"></canvas><span>Задачи</span></button>
    </nav>
  </section>
  <dialog id="setup">
    <form method="dialog">
      <h2 id="setup-title"></h2>
      <label for="opponent-mode">С кем играть</label>
      <select id="opponent-mode">
        <option value="friend">С другом</option>
        <option value="easy">Компьютер · лёгкий</option>
        <option value="normal">Компьютер · обычный</option>
      </select>
      <label id="rules-label" for="draughts-rules">Правила взятия</label>
      <select id="draughts-rules">
        <option value="huff">За фук</option>
        <option value="strict">Обязательное взятие</option>
      </select>
      <label id="clock-label" for="clock-mode">Контроль времени</label>
      <select id="clock-mode">
        <option value="none">Без часов</option>
        <option value="rapid">5 мин + 3 с за ход</option>
        <option value="daily">1 день на ход</option>
      </select>
      <button id="create-game" class="brass" value="create">Создать партию</button>
      <button value="cancel">Отмена</button>
    </form>
  </dialog>
  <dialog id="settings-dialog">
    <form method="dialog">
      <h2>Настройки</h2>
      <button id="notifications" type="button">Уведомления о ходе</button>
      <button>Закрыть</button>
    </form>
  </dialog>
  <section id="game" hidden>

    <div id="review-controls" class="actions" hidden>
      <button id="prev-ply">← Назад</button><span id="ply"></span>
      <button id="next-ply">Вперёд →</button><button id="exit-review">К результату</button>
    </div>
    <p id="score" hidden></p>
    <p id="game-rule" hidden></p>
    <div id="opponent-panel" class="player-panel" hidden>
      <span class="player-disc" aria-hidden="true"></span>
      <strong id="opponent-name">Соперник</strong><span id="opponent-turn" class="turn-mark" hidden>Ход соперника</span>
      <span id="opponent-clock" class="player-clock" hidden></span>
    </div>
    <div class="board-space">
    <div class="board-frame">
      <div id="ranks" class="board-ranks" aria-hidden="true"></div>
      <div id="board" aria-label="Игровая доска"></div>
      <div id="files" class="board-files" aria-hidden="true"></div>
    </div>
    </div>
    <p id="feedback" role="status" hidden></p>
    <div id="self-panel" class="player-panel" hidden>
      <span class="player-disc" aria-hidden="true"></span>
      <strong>Вы</strong><span id="self-turn" class="turn-mark" hidden>Ваш ход</span>
      <span id="self-clock" class="player-clock" hidden></span>
    </div>
    <div id="promotion" hidden aria-label="Выбор фигуры"></div>
    <div class="actions">
      <button id="invite">Пригласить друга</button>
      <button id="rematch" hidden>Реванш</button>
      <button id="review" hidden>Посмотреть ходы</button>
      <button id="draw-offer" hidden>Предложить ничью</button>
      <button id="draw-decline" hidden>Отклонить</button>
      <button id="training-undo" hidden>Отменить ход</button>
      <button id="puzzle-next" hidden>Следующая задача</button>
      <button id="puzzle-retry" hidden>Повторить</button>
      <button id="back">К выбору игры</button>
    </div>
  </section>
  <p id="error" role="alert"></p>
</main>
</html>
